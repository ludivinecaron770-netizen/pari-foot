<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Pronostics Foot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch-dark: #0e3320;
    --pitch: #1a5c3a;
    --chalk: #f4f7f2;
    --chalk-dim: #c9d6cc;
    --gold: #f0a202;
    --gold-dark: #c97e00;
    --green-ok: #4caf50;
    --error: #ff6b6b;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 90px),
      linear-gradient(180deg, var(--pitch) 0%, var(--pitch-dark) 100%);
    background-attachment: fixed;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--chalk);
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .wrap { width: 100%; max-width: 460px; }
  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 6vw, 2.1rem);
    text-align: center;
    margin: 8px 0 28px;
    letter-spacing: 0.02em;
  }
  .section { display: none; }
  .section.active { display: block; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 16px;
    backdrop-filter: blur(6px);
  }
  p.lead { color: var(--chalk-dim); margin-top: 0; line-height: 1.5; }
  label { display: block; font-size: 0.85rem; color: var(--chalk-dim); margin: 14px 0 6px; }
  input {
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: rgba(0,0,0,0.25);
    color: var(--chalk);
    font-size: 1rem;
    font-family: inherit;
  }
  input[type="text"] { width: 100%; }
  input::placeholder { color: rgba(244,247,242,0.4); }
  input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: var(--gold);
    color: #1a1200;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: var(--gold-dark); }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .footer-link {
    display: block;
    text-align: center;
    color: var(--chalk-dim);
    font-size: 0.85rem;
    margin-top: 6px;
    text-decoration: underline;
    cursor: pointer;
  }
  .error-msg {
    color: var(--error);
    font-size: 0.88rem;
    margin-top: 10px;
    display: none;
  }
  .match-card { text-align: center; }
  .match-date { color: var(--chalk-dim); font-size: 0.85rem; margin-bottom: 10px; }
  .match-teams {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(1.1rem, 5vw, 1.4rem);
    font-weight: 700;
  }
  .match-score-live {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(2rem, 10vw, 2.6rem);
    color: var(--gold);
    margin-top: 8px;
  }
  .status-tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--card-border);
    color: var(--chalk-dim);
  }
  .status-tag.finished { border-color: var(--green-ok); color: var(--green-ok); }
  .bet-inputs {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 10px;
  }
  .bet-inputs input { width: 64px; text-align: center; font-size: 1.3rem; font-family: 'Oswald', sans-serif; }
  .bet-inputs .vs { color: var(--chalk-dim); font-family: 'Oswald', sans-serif; }
  .my-bet-recap {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 0.9rem;
    margin-top: 8px;
  }
  .my-bet-recap strong { color: var(--chalk); }
  h2.section-title {
    font-family: 'Oswald', sans-serif;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    margin: 0 0 14px;
    color: var(--chalk-dim);
  }
  .board-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    gap: 8px;
  }
  .board-row:last-child { border-bottom: none; }
  .board-row .rank {
    font-family: 'Oswald', sans-serif;
    color: var(--chalk-dim);
    width: 22px;
    flex-shrink: 0;
  }
  .board-row .name { flex: 1; overflow-wrap: anywhere; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .board-row .you-tag {
    font-size: 0.72rem;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .board-row .bet-value { color: var(--chalk-dim); font-size: 0.85rem; flex-shrink: 0; }
  .board-row .points {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    color: var(--gold);
    flex-shrink: 0;
    width: 40px;
    text-align: right;
  }
  .empty-note { color: var(--chalk-dim); font-size: 0.9rem; text-align: center; padding: 12px 0; }
  .loading-note { color: var(--chalk-dim); font-size: 0.9rem; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚽ Pronostics Foot</h1>

  <!-- Pseudo -->
  <div id="pseudo-section" class="section active">
    <div class="card">
      <p class="lead">Entre ton pseudo pour rejoindre les pronostics.</p>
      <label for="pseudo">Pseudo</label>
      <input type="text" id="pseudo" placeholder="Ex: Ludivine" maxlength="24">
      <button onclick="setPseudo()">Rejoindre</button>
      <p class="error-msg" id="pseudo-error">Entre un pseudo pour continuer.</p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard-section" class="section">

    <div class="card match-card">
      <div id="match-loading" class="loading-note">Chargement du prochain match...</div>
      <div id="match-content" style="display:none;">
        <div class="match-date" id="match-date"></div>
        <div class="match-teams" id="match-teams"></div>
        <div id="match-live-score" style="display:none;" class="match-score-live"></div>
        <div class="status-tag" id="match-status-tag"></div>
      </div>
      <p class="error-msg" id="match-error"></p>
    </div>

    <div class="card" id="bet-card" style="display:none;">
      <p class="lead" id="bet-lead">Salut <strong id="user-pseudo"></strong> 👋 Fais ton pronostic :</p>
      <div class="bet-inputs">
        <input type="number" id="bet-home" min="0" max="20" placeholder="0">
        <span class="vs">—</span>
        <input type="number" id="bet-away" min="0" max="20" placeholder="0">
      </div>
      <button onclick="submitBet()" id="bet-btn">Valider mon pronostic</button>
      <p class="my-bet-recap" id="my-bet-recap" style="display:none;"></p>
      <p class="error-msg" id="bet-error"></p>
    </div>

    <div class="card">
      <h2 class="section-title">Classement des pronostics</h2>
      <div id="leaderboard"></div>
      <p class="empty-note" id="leaderboard-empty" style="display:none;">Personne n'a encore parié. Sois le·la premier·ère !</p>
    </div>

    <span class="footer-link" onclick="changePseudo()">Changer de pseudo</span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, serverTimestamp,
  collection, query, orderBy, limit, onSnapshot, getDocs, where
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

// ⚠️ Remplacez par votre configuration Firebase (nouveau projet)
const firebaseConfig = {

  apiKey: "AIzaSyBcorrKKozkQd04aiR4y7sKT7RFfpD4SDE",

  authDomain: "pari-foot.firebaseapp.com",

  projectId: "pari-foot",

  storageBucket: "pari-foot.firebasestorage.app",

  messagingSenderId: "279576898714",

  appId: "1:279576898714:web:5807965d34ed2c6188c323",

  measurementId: "G-W6F8QBPM39"

};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ⚠️ Remplacez par l'URL de votre nouveau Worker Cloudflare
const PROXY_URL = "https://flat-boat-e8ea.ludivinecaron770.workers.dev";

let currentPseudo = "";
let currentMatch = null; // { id, homeTeam, awayTeam, utcDate, status, homeScore, awayScore }
let unsubscribeLeaderboard = null;

function show(sectionId) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById(sectionId).classList.add("active");
}

function pseudoDocId(pseudo) {
  return pseudo.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "-").slice(0, 40) || "joueur";
}

function betDocId(matchId, pseudo) {
  return `${matchId}_${pseudoDocId(pseudo)}`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// Barème de points
function computeGain(betHome, betAway, actualHome, actualAway) {
  if (betHome === actualHome && betAway === actualAway) return 5;
  const betDiff = betHome - betAway;
  const actualDiff = actualHome - actualAway;
  if (betDiff === actualDiff) return 3;
  const outcome = d => (d > 0 ? 1 : d < 0 ? -1 : 0);
  if (outcome(betDiff) === outcome(actualDiff)) return 1;
  return 0;
}

window.setPseudo = function () {
  const input = document.getElementById("pseudo");
  const pseudo = input.value.trim();
  const errorEl = document.getElementById("pseudo-error");

  if (!pseudo) {
    errorEl.style.display = "block";
    return;
  }
  errorEl.style.display = "none";

  currentPseudo = pseudo;
  localStorage.setItem("footBetPseudo", pseudo);
  document.getElementById("user-pseudo").textContent = pseudo;

  show("dashboard-section");
  loadNextMatch();
};

window.changePseudo = function () {
  if (unsubscribeLeaderboard) { unsubscribeLeaderboard(); unsubscribeLeaderboard = null; }
  document.getElementById("pseudo").value = currentPseudo;
  show("pseudo-section");
};

async function loadNextMatch() {
  const loadingEl = document.getElementById("match-loading");
  const contentEl = document.getElementById("match-content");
  const errorEl = document.getElementById("match-error");
  loadingEl.style.display = "block";
  contentEl.style.display = "none";
  errorEl.style.display = "none";

  try {
    const response = await fetch(`${PROXY_URL}/next?competition=FL1`);
    if (!response.ok) throw new Error(`Erreur API (${response.status})`);
    const data = await response.json();

    if (!data.matches || data.matches.length === 0) {
      throw new Error("Aucun match à venir trouvé.");
    }

    const sorted = [...data.matches].sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
    const next = sorted[0];

    currentMatch = {
      id: next.id,
      homeTeam: next.homeTeam.shortName || next.homeTeam.name,
      awayTeam: next.awayTeam.shortName || next.awayTeam.name,
      utcDate: next.utcDate,
      status: next.status,
      homeScore: null,
      awayScore: null
    };

    renderMatch();
    await checkMatchResolution();
    startLeaderboard();

    loadingEl.style.display = "none";
    contentEl.style.display = "block";

  } catch (error) {
    loadingEl.style.display = "none";
    errorEl.textContent = `Erreur : ${error.message}`;
    errorEl.style.display = "block";
  }
}

function renderMatch() {
  const d = new Date(currentMatch.utcDate);
  document.getElementById("match-date").textContent = d.toLocaleString("fr-FR", {
    weekday: "long", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
  });
  document.getElementById("match-teams").textContent = `${currentMatch.homeTeam} — ${currentMatch.awayTeam}`;

  const tag = document.getElementById("match-status-tag");
  const kickoffPassed = new Date() >= new Date(currentMatch.utcDate);

  if (currentMatch.status === "FINISHED") {
    tag.textContent = "Match terminé";
    tag.classList.add("finished");
    document.getElementById("match-live-score").style.display = "block";
    document.getElementById("match-live-score").textContent = `${currentMatch.homeScore} - ${currentMatch.awayScore}`;
    document.getElementById("bet-card").style.display = "none";
  } else if (kickoffPassed) {
    tag.textContent = "Paris clôturés, en attente du résultat";
    document.getElementById("bet-card").style.display = "block";
    showBetForm(false);
  } else {
    tag.textContent = "Pronostics ouverts";
    document.getElementById("bet-card").style.display = "block";
    showBetForm(true);
  }
}

async function showBetForm(editable) {
  const btn = document.getElementById("bet-btn");
  const recap = document.getElementById("my-bet-recap");
  const homeInput = document.getElementById("bet-home");
  const awayInput = document.getElementById("bet-away");

  const existing = await getDoc(doc(db, "scores", betDocId(currentMatch.id, currentPseudo)));

  if (existing.exists()) {
    const d = existing.data();
    homeInput.value = d.butHome;
    awayInput.value = d.butAway;
    recap.style.display = "block";
    recap.innerHTML = `Ton pronostic actuel : <strong>${d.butHome} - ${d.butAway}</strong>`;
  } else {
    recap.style.display = "none";
  }

  const disable = !editable;
  homeInput.disabled = disable;
  awayInput.disabled = disable;
  btn.disabled = disable;
  btn.textContent = editable ? (existing.exists() ? "Modifier mon pronostic" : "Valider mon pronostic") : "Paris clôturés";
}

window.submitBet = async function () {
  const homeInput = document.getElementById("bet-home");
  const awayInput = document.getElementById("bet-away");
  const errorEl = document.getElementById("bet-error");
  const btn = document.getElementById("bet-btn");
  errorEl.style.display = "none";

  const butHome = parseInt(homeInput.value, 10);
  const butAway = parseInt(awayInput.value, 10);

  if (isNaN(butHome) || isNaN(butAway) || butHome < 0 || butAway < 0) {
    errorEl.textContent = "Entre un score valide pour les deux équipes.";
    errorEl.style.display = "block";
    return;
  }

  if (new Date() >= new Date(currentMatch.utcDate)) {
    errorEl.textContent = "Les paris sont clôturés pour ce match.";
    errorEl.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Enregistrement...";

  try {
    const ref = doc(db, "scores", betDocId(currentMatch.id, currentPseudo));
    await setDoc(ref, {
      pseudo: currentPseudo,
      matchId: currentMatch.id,
      butHome,
      butAway,
      gain: 0,
      updatedAt: serverTimestamp()
    }, { merge: true });

    await showBetForm(true);
  } catch (error) {
    errorEl.textContent = `Erreur : ${error.message}`;
    errorEl.style.display = "block";
  } finally {
    btn.disabled = false;
  }
};

async function checkMatchResolution() {
  try {
    const response = await fetch(`${PROXY_URL}/match?id=${currentMatch.id}`);
    if (!response.ok) return;
    const data = await response.json();
    const match = data.match || data;

    if (match.status === "FINISHED" && match.score && match.score.fullTime) {
      currentMatch.status = "FINISHED";
      currentMatch.homeScore = match.score.fullTime.home || 0;
      currentMatch.awayScore = match.score.fullTime.away || 0;
      renderMatch();
      await resolveAllBets();
    }
  } catch (error) {
    console.error("Erreur vérification résultat:", error);
  }
}

async function resolveAllBets() {
  const q = query(collection(db, "scores"), where("matchId", "==", currentMatch.id));
  const snapshot = await getDocs(q);

  for (const docSnap of snapshot.docs) {
    const d = docSnap.data();
    const gain = computeGain(d.butHome, d.butAway, currentMatch.homeScore, currentMatch.awayScore);
    if (d.gain !== gain) {
      await setDoc(doc(db, "scores", docSnap.id), { gain }, { merge: true });
    }
  }
}

function startLeaderboard() {
  if (unsubscribeLeaderboard) unsubscribeLeaderboard();

  const q = query(collection(db, "scores"), orderBy("gain", "desc"), limit(100));
  unsubscribeLeaderboard = onSnapshot(q, (snapshot) => {
    const board = document.getElementById("leaderboard");
    const emptyNote = document.getElementById("leaderboard-empty");
    board.innerHTML = "";

    const rows = snapshot.docs
      .map(d => d.data())
      .filter(d => d.matchId === currentMatch.id);

    if (rows.length === 0) {
      emptyNote.style.display = "block";
      return;
    }
    emptyNote.style.display = "none";

    let rank = 0;
    rows.forEach((d) => {
      rank++;
      const isYou = d.pseudo === currentPseudo;
      const resolved = currentMatch.status === "FINISHED";

      const row = document.createElement("div");
      row.className = "board-row";
      row.innerHTML = `
        <span class="rank">#${rank}</span>
        <span class="name">
          ${escapeHtml(d.pseudo || "?")}
          ${isYou ? '<span class="you-tag">TOI</span>' : ""}
        </span>
        <span class="bet-value">${d.butHome}-${d.butAway}</span>
        <span class="points">${resolved ? d.gain : "?"}</span>
      `;
      board.appendChild(row);
    });
  });
}

window.onload = function () {
  const saved = localStorage.getItem("footBetPseudo");
  if (saved) {
    document.getElementById("pseudo").value = saved;
  }
};
</script>
</body>
</html>
